name: Build packages

on:
  push:
    branches: [ "main" ]
    tags: [ "droidian/*" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0  # releng-build-package derives the version from git history and tags
    - name: Build and test in the Droidian build container
      run: |
        docker run -v ${{ github.workspace }}:/sources -v /tmp/results:/results \
          quay.io/droidian/build-essential:next-arm64 /bin/bash -c '
          set -e
          cd /sources
          git config --global --add safe.directory /sources
          RELENG_FULL_BUILD=yes RELENG_HOST_ARCH="arm64" releng-build-package
          mv -v ../*.deb ../*.buildinfo ../*.changes /results
          '
    - uses: actions/upload-artifact@v4
      with:
        path: /tmp/results
    - name: Publish release
      if: github.event_name != 'pull_request'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        version=$(dpkg-deb -f $(ls /tmp/results/adaptation-sony-pdx206-extras_*.deb) Version | sed 's/+/-/g;s/~/-/g')
        gh release create "$version" /tmp/results/* --title "$version" --target "$GITHUB_SHA" --notes "Built from $GITHUB_SHA"
