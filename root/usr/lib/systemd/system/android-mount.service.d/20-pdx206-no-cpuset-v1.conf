# lxc-android's mount-android mounts the v1 cpuset hierarchy on /dev/cpuset
# before running mount-android.sh. Our kernel backports cpuset to cgroup v2
# (k3s needs it there), and a controller can only be bound to one hierarchy,
# so skip the v1 mount and run the rest of mount-android unchanged.
[Service]
ExecStart=
ExecStart=/usr/bin/env BIND_MOUNT_PATH=/var/lib/lxc/android/rootfs /usr/sbin/mount-android.sh
