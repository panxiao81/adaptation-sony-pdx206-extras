# Cellular links brought up by the vendor stack (IMS, data) get router
# advertisements from the operator gateway. Keep SLAAC (netmgrd sets
# accept_ra=2, IMS needs the address) but never take a default route
# from them: on Android netd keeps these routes in per-network tables,
# here they would land in the main table and carry host traffic, e.g.
# all IPv6 over the IMS link while roaming. NetworkManager adds its own
# default route for the mobile data connection it manages.
net.ipv6.conf.rmnet_data*.accept_ra_defrtr = 0
