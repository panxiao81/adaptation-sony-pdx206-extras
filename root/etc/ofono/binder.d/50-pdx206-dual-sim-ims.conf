# pdx206 (Xperia 5 II), merged over the stock binder.conf from
# ofono-configs-binder-common (ofono_conf_merge_files: same keys overwrite).

[Settings]
# pdx206 is DSDS (persist.radio.multisim.config=dsds); vendor serves IRadio/slot1 and IRadio/slot2
ExpectSlots = slot1,slot2
# 2G/3G are switched off in Japan; let the non-data SIM use LTE too
MaxNonDataMode = lte
# Qualcomm IMS (VoLTE / IMS SMS) via ofono-binder-plugin-ext-qti
extPlugin = qti

[slot2]
path = /ril_1
slot = 1
